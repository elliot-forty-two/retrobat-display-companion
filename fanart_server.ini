[BackglassViewer]
; auto = keep the current behavior: backglass if available, otherwise fanart composite
; fanart = subject-aware fit fanart on backglass screen (no logo/marquee overlay on backglass)
; backglass = show backglass directly, fallback to subject-aware fit fanart (no overlay on backglass)
BackglassScreenMode=auto

; logo = prefer logo/topper on the DMD screen, falling back to marquee
; marquee = keep the current marquee behavior
DmdScreenMode=logo

; DMD canvas size used for centered logo rendering in logo mode
; Example for 4:1 DMD panel: 1920x480
DmdWidth=1920
DmdHeight=480

; Centered logo fit scale on DMD canvas (0.1 to 1.0)
; 1.0 = max fit, lower values add padding around logo
DmdLogoScale=1.0

; QueueSettleMs=150
[DisplayCompanion]
; Ordered fallback list for the backglass display.
; video = video or videos (tablename-backglass.ext); backglass = images/*-backglass; composite = fanart with marquee overlay; fanart = plain images/*-fanart.
BackglassMediaTypes=video,backglass,composite

; Ordered fallback list for the DMD display.
; video = video or videos (tablename-dmd.ext); logo = centered images/*-logo, *-marquee-topper, or *-topper; marquee = direct images/*-marquee.
DmdMediaTypes=video,logo,marquee

; DMD canvas size used for centered logo rendering
; Example for 4:1 DMD panel: 1920x480
DmdWidth=1920
DmdHeight=480

; Centered logo fit scale on DMD canvas (0.1 to 1.0)
; 1.0 = max fit, lower values add padding around logo
DmdLogoScale=1.0

; Systems whose auxiliary displays should be blanked while a game is running.
; Other systems keep the currently selected artwork visible while the game runs.
BlankOnGameStartSystems=vpinball,futurepinball

; ----------------------------------------------------------------------
; VPX capture
; ----------------------------------------------------------------------

CaptureEnabled=true
CaptureSystems=vpinball

CaptureFfmpeg=
CaptureOutputDir=C:\RetroBat\captures

CaptureDurationSeconds=60

CapturePlayfieldVideo=true
CapturePlayfieldFramerate=24
CapturePlayfieldQuality=23

CaptureBackglassVideo=true
CaptureBackglassFramerate=15
CaptureBackglassQuality=25

CaptureDmdVideo=false
CaptureDmdFramerate=15
CaptureDmdQuality=25

CaptureQsvPreset=veryfast
CaptureQsvAsyncDepth=2

CaptureStillStartDelaySeconds=3
CaptureStillSampleSeconds=2
CaptureStillSampleDurationSeconds=30

CapturePlayfield=0,0,1440,2560
CaptureBackglass=1440,0,1280,1024
CaptureDmd=2720,0,1920,480